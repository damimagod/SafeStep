<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeStep Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#060d14;font-family:'Courier New',monospace;color:#7effd4;padding:10px;}
canvas{display:block;width:100%;border-radius:8px;background:#040a0f;cursor:crosshair;}
</style>
</head>
<body>
<canvas id="mc" height="300"></canvas>

<script>
const canvas = document.getElementById('mc');
const dpr = window.devicePixelRatio || 1;
let CW, CH = 300;
function initCanvas() {
  CW = canvas.offsetWidth || 340;
  canvas.width = CW * dpr;
  canvas.height = CH * dpr;
}
initCanvas();
const ctx = canvas.getContext('2d');
ctx.scale(dpr, dpr);

const zoneDefs = [
  {id:'Z1',  label:'Z1',  sub:'Shaft entrance', fx:0.06, fy:0.44, fw:0.12, fh:0.18},
  {id:'Z2',  label:'Z2',  sub:'Main corridor',  fx:0.22, fy:0.30, fw:0.12, fh:0.26},
  {id:'Z3',  label:'Z3',  sub:'Lower shaft',    fx:0.22, fy:0.68, fw:0.12, fh:0.18},
  {id:'Z4',  label:'Z4',  sub:'Cross tunnel',   fx:0.38, fy:0.12, fw:0.12, fh:0.22},
  {id:'Z5',  label:'Z5',  sub:'Storage bay',    fx:0.38, fy:0.42, fw:0.12, fh:0.22},
  {id:'Z6',  label:'Z6',  sub:'Pump room',      fx:0.38, fy:0.72, fw:0.12, fh:0.18},
  {id:'Z7',  label:'Z7',  sub:'Upper gallery',  fx:0.55, fy:0.06, fw:0.12, fh:0.22},
  {id:'Z8',  label:'Z8',  sub:'Mid gallery',    fx:0.55, fy:0.40, fw:0.12, fh:0.22},
  {id:'Z9',  label:'Z9',  sub:'Junction hall',  fx:0.55, fy:0.70, fw:0.12, fh:0.20},
  {id:'Z10', label:'Z10', sub:'Exit corridor',  fx:0.73, fy:0.28, fw:0.13, fh:0.40},
];

const connections = [
  ['ENTRY','Z1'],
  ['Z1','Z2'],['Z1','Z3'],
  ['Z2','Z4'],['Z2','Z5'],
  ['Z3','Z5'],['Z3','Z6'],
  ['Z4','Z7'],['Z4','Z5'],
  ['Z5','Z8'],['Z5','Z6'],
  ['Z6','Z9'],
  ['Z7','Z10'],['Z8','Z10'],['Z9','Z10'],
  ['Z10','EXITA'],['Z10','EXITB'],
];

const specialNodes = {
  ENTRY: {fx:0.01, fy:0.50, label:'ENTRY'},
  EXITA: {fx:0.93, fy:0.20, label:'EXIT A'},
  EXITB: {fx:0.93, fy:0.80, label:'EXIT B'},
};

const zones = {};
zoneDefs.forEach(z => zones[z.id] = false);
let miners = [];
let currentRoute = null, altRoute = null;

function zoneCenter(id) {
  if (specialNodes[id]) return { x: specialNodes[id].fx * CW, y: specialNodes[id].fy * CH };
  const z = zoneDefs.find(z => z.id === id);
  return { x: (z.fx + z.fw / 2) * CW, y: (z.fy + z.fh / 2) * CH };
}

function zoneRect(id) {
  const z = zoneDefs.find(z => z.id === id);
  if (!z) return null;
  return { x: z.fx * CW, y: z.fy * CH, w: z.fw * CW, h: z.fh * CH };
}

function findPath(start, end) {
  const graph = {};
  connections.forEach(([a, b]) => {
    if (!graph[a]) graph[a] = [];
    if (!graph[b]) graph[b] = [];
    graph[a].push(b); graph[b].push(a);
  });
  const queue = [[start, [start]]];
  const visited = new Set([start]);
  while (queue.length) {
    const [node, path] = queue.shift();
    if (node === end) return path;
    for (const nb of (graph[node] || [])) {
      if (!visited.has(nb) && !zones[nb]) {
        visited.add(nb);
        queue.push([nb, [...path, nb]]);
      }
    }
  }
  return null;
}

// Called from Thunkable via callJavaScript
function toggleZone(id) {
  zones[id] = !zones[id];
  updateRoute();
  draw();
}

function setZone(id, hazardous) {
  zones[id] = hazardous;
  updateRoute();
  draw();
}

function placeMiner(id, zoneId) {
  miners = miners.filter(m => m.id !== id);
  miners.push({ id, zone: zoneId });
  draw();
}

function removeMiner(id) {
  miners = miners.filter(m => m.id !== id);
  draw();
}

function clearMiners() {
  miners = [];
  draw();
}

function updateRoute() {
  const startNodes = miners.length > 0 ? [...new Set(miners.map(m => m.zone))] : ['ENTRY'];
  currentRoute = null; altRoute = null;
  for (const start of startNodes) {
    if (zones[start]) continue;
    const pri = findPath(start, 'EXITA');
    if (pri) { currentRoute = pri; break; }
    const alt = findPath(start, 'EXITB');
    if (alt) { altRoute = alt; }
  }
}

function drawPath(pts, color, dashed) {
  if (!pts || pts.length < 2) return;
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.setLineDash(dashed ? [7, 5] : []);
  ctx.shadowColor = color; ctx.shadowBlur = 8;
  ctx.beginPath();
  pts.forEach((id, i) => {
    const c = zoneCenter(id);
    if (i === 0) ctx.moveTo(c.x, c.y); else ctx.lineTo(c.x, c.y);
  });
  ctx.stroke();
  ctx.setLineDash([]); ctx.shadowBlur = 0;
  pts.forEach((id, i) => {
    if (i === 0 || i === pts.length - 1) return;
    const c = zoneCenter(id);
    ctx.beginPath(); ctx.arc(c.x, c.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
  });
}

function draw() {
  ctx.clearRect(0, 0, CW, CH);
  ctx.fillStyle = '#040a0f'; ctx.fillRect(0, 0, CW, CH);

  // grid
  for (let x = 0; x < CW; x += 16) {
    ctx.strokeStyle = 'rgba(255,255,255,0.022)'; ctx.lineWidth = 0.5;
    ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CH); ctx.stroke();
  }
  for (let y = 0; y < CH; y += 16) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke();
  }

  // tunnel pipes
  connections.forEach(([a, b]) => {
    const ca = zoneCenter(a), cb = zoneCenter(b);
    ctx.strokeStyle = 'rgba(30,255,160,0.09)'; ctx.lineWidth = 9;
    ctx.lineCap = 'round'; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(ca.x, ca.y); ctx.lineTo(cb.x, cb.y); ctx.stroke();
  });

  // routes
  if (currentRoute) drawPath(currentRoute, '#1aff8c', false);
  if (altRoute)     drawPath(altRoute,     '#f0c040', true);

  // zones
  zoneDefs.forEach(z => {
    const x = z.fx * CW, y = z.fy * CH, w = z.fw * CW, h = z.fh * CH;
    const hz = zones[z.id];
    ctx.fillStyle   = hz ? 'rgba(255,85,85,0.18)' : 'rgba(30,255,160,0.06)';
    ctx.strokeStyle = hz ? 'rgba(255,85,85,0.75)'  : 'rgba(30,255,160,0.28)';
    ctx.lineWidth = 1; ctx.setLineDash(hz ? [3, 3] : []);
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 5); ctx.fill(); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = hz ? 'rgba(255,150,150,0.95)' : 'rgba(30,255,160,0.8)';
    ctx.font = `700 ${Math.round(w * 0.19)}px monospace`; ctx.textAlign = 'center';
    ctx.fillText(z.label, x + w / 2, y + h / 2 - 3);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.font = `${Math.round(w * 0.11)}px monospace`;
    ctx.fillText(z.sub, x + w / 2, y + h / 2 + 11);
    if (hz) {
      ctx.fillStyle = '#f0c040';
      ctx.font = `${Math.round(w * 0.18)}px monospace`;
      ctx.fillText('⚠', x + w - 10, y + 13);
    }
  });

  // entry / exit nodes
  Object.entries(specialNodes).forEach(([id, n]) => {
    const x = n.fx * CW, y = n.fy * CH;
    ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#58a6ff'; ctx.fill();
    ctx.fillStyle = 'rgba(88,166,255,0.85)';
    ctx.font = '8px monospace'; ctx.textAlign = 'center';
    ctx.fillText(n.label, x, y + (id === 'ENTRY' ? -11 : 17));
  });

  // miners
  miners.forEach((m, i) => {
    const r = zoneRect(m.zone); if (!r) return;
    const mx = r.x + r.w * 0.5 + (i % 2 === 0 ? -8 : 8);
    const my = r.y + r.h * 0.68;
    const hz = zones[m.zone];
    const col = hz ? '#ff5555' : '#e056fd';
    ctx.beginPath(); ctx.arc(mx, my, 7, 0, Math.PI * 2);
    ctx.fillStyle = hz ? 'rgba(255,85,85,0.2)' : 'rgba(224,86,253,0.2)'; ctx.fill();
    ctx.beginPath(); ctx.arc(mx, my, 4, 0, Math.PI * 2);
    ctx.fillStyle = col; ctx.fill();
    ctx.fillStyle = col; ctx.font = '700 7px monospace'; ctx.textAlign = 'center';
    ctx.fillText(m.id, mx, my - 9);
  });
}

updateRoute();
draw();
</script>
</body>
</html>
