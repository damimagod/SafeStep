<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeStep — Methyl Orange Path Analyzer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a24;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h2 {
            color: #00ffcc;
            margin-bottom: 5px;
            font-size: 1.4rem;
        }
        .subtitle {
            color: #aaaaaa;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        #video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border: 2px solid #333344;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        video {
            width: 100%;
            display: block;
        }
        button {
            background-color: #00ffcc;
            color: #1a1a24;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin: 15px 0;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0, 255, 204, 0.2);
        }
        button:active {
            transform: scale(0.98);
        }
        .dashboard {
            background-color: #252535;
            border-radius: 8px;
            padding: 15px;
            margin: 10px auto;
            max-width: 370px;
            text-align: left;
            border: 1px solid #3a3a4f;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .data-label {
            color: #bbbbbb;
        }
        .data-value {
            font-weight: bold;
            color: #ffcc00;
        }
        #hazard-status {
            font-size: 1.1rem;
            text-align: center;
            margin-top: 5px;
            padding: 8px;
            border-radius: 5px;
            font-weight: bold;
        }
        .safe { background-color: rgba(0, 255, 0, 0.1); color: #00ff00; border: 1px solid #00ff00; }
        .danger-acid { background-color: rgba(255, 0, 0, 0.1); color: #ff3333; border: 1px solid #ff3333; }
        .danger-base { background-color: rgba(255, 204, 0, 0.1); color: #ffcc00; border: 1px solid #ffcc00; }
        canvas { display: none; }
    </style>
</head>
<body>

    <h2>SAFESTEP ANALYZER</h2>
    <div class="subtitle">Rescue Companion Module (Full Methyl Orange Spectrum)</div>

    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <button id="snap-btn">ASSESS SPRAY PATHWAY</button>

    <div class="dashboard">
        <div class="data-row">
            <span class="data-label">Average Glow Value:</span>
            <span id="glow-value" class="data-value">--</span>
        </div>
        <div class="data-row">
            <span class="data-label">Estimated Spray Age:</span>
            <span id="spray-age" class="data-value" style="color: #00ffcc;">Waiting...</span>
        </div>
        <hr style="border: 0; border-top: 1px solid #3a3a4f; margin: 12px 0;">
        <div id="hazard-status" class="safe">SYSTEM READY</div>
    </div>

    <canvas id="analyzer-canvas"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('analyzer-canvas');
        const snapBtn = document.getElementById('snap-btn');
        const glowValueDisplay = document.getElementById('glow-value');
        const sprayAgeDisplay = document.getElementById('spray-age');
        const hazardStatusDisplay = document.getElementById('hazard-status');

        // Request native camera streaming inside the WebViewer container frame
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("Camera access error: ", err);
                sprayAgeDisplay.innerText = "Camera Error / Check Permissions";
            });

        snapBtn.addEventListener('click', () => {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imgData.data;

            let totalLuminance = 0;
            let glowingPixelCount = 0;
            let acidRedCount = 0;
            let baseYellowCount = 0;

            // Optimized processing increment to protect phone processor speed
            for (let i = 0; i < pixels.length; i += 16) {
                let r = pixels[i];
                let g = pixels[i+1];
                let b = pixels[i+2];

                // Native grayscale brightness calculation
                let brightness = (0.299 * r) + (0.587 * g) + (0.114 * b);
                
                // 1. Isolate the Yellow-Green phosphorescent glowing paint matrix
                if (g > 60 && g > b * 1.3 && r > 40) {
                    totalLuminance += brightness;
                    glowingPixelCount++;
                }

                // 2. Identify Acidic Shift (Vibrant Red)
                if (r > 130 && g < 75 && b < 75) {
                    acidRedCount++;
                }

                // 3. Identify Basic Shift (Pure Bright Yellow)
                if (r > 160 && g > 150 && b < 70) {
                    baseYellowCount++;
                }
            }

            // Mathematical execution of exponential glow fading equations
            if (glowingPixelCount > 0) {
                let avgBrightness = totalLuminance / glowingPixelCount;
                glowValueDisplay.innerText = Math.round(avgBrightness) + " / 255";

                let maxBrightness = 255.0;
                let ratio = avgBrightness / maxBrightness;
                
                if (ratio >= 1.0) {
                    sprayAgeDisplay.innerText = "0 mins ago (Just Sprayed)";
                } else if (avgBrightness < 8) {
                    sprayAgeDisplay.innerText = "Expired / Path Dark";
                } else {
                    let k = 35.0; // Fading constant variables matching paint brand
                    let timeElapsed = -k * Math.log(ratio);
                    sprayAgeDisplay.innerText = timeElapsed.toFixed(1) + " minutes ago";
                }
            } else {
                glowValueDisplay.innerText = "0";
                sprayAgeDisplay.innerText = "No Pathway Detected";
            }

            // Visual UI update flags based on indicator criteria thresholds
            if (acidRedCount > 30) { 
                hazardStatusDisplay.innerText = "⚠️ DANGER: CORROSIVE ATMOSPHERE (ACID GAS)";
                hazardStatusDisplay.className = "danger-acid";
            } else if (baseYellowCount > 100) { 
                hazardStatusDisplay.innerText = "⚠️ DANGER: TOXIC VAPOR DETECTED (BASE EXPOSURE)";
                hazardStatusDisplay.className = "danger-base";
            } else {
                hazardStatusDisplay.innerText = "✅ ATMOSPHERIC CONDITION SAFE";
                hazardStatusDisplay.className = "safe";
            }
        });
    </script>
</body>
</html>
